name: Playwright Tests
on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
         - name: Notify Microsoft Teams
      if: always()
      run: |
        curl -H "Content-Type: application/json" -d '{
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "summary": "Playwright Tests",
          "themeColor": "0076D7",
          "title": "Playwright Test Results",
          "sections": [{
            "facts": [
              { "name": "Repository", "value": "${{ github.repository }}" },
              { "name": "Branch", "value": "${{ github.ref_name }}" },
              { "name": "Status", "value": "${{ job.status }}" }
            ],
            "markdown": true
          }],
          "potentialAction": [{
            "@type": "OpenUri",
            "name": "View GitHub Run",
            "targets": [{
              "os": "default",
              "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }]
        }' ${{ secrets.TEAMS_WEBHOOK_URL }}   
       
    - name: Send report by email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}    
        server_port: ${{ secrets.SMTP_PORT }}         
        username: ${{ secrets.SMTP_USERNAME }}        
        password: ${{ secrets.SMTP_PASSWORD }}        
        subject: "Playwright Test Report - ${{ github.repository }}"
        to: ${{ secrets.EMAIL_TO }}                   
        from: ${{ secrets.EMAIL_FROM }}               
        body: |
          Playwright tests have finished.
 
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Status: ${{ job.status }}
 
          GitHub Run:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        attachments: playwright-report.zip



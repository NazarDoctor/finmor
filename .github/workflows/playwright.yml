  name: Playwright Tests
on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
 
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
 
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
 
    - name: Install dependencies
      run: npm ci
 
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
 
    - name: Run Playwright tests
      id: run_tests
      run: npx playwright test --reporter=html,json
      continue-on-error: true
 
    - name: Parse test results
      id: results
      if: always()
      run: |
        if [ -f "test-results.json" ]; then
          PASSED=$(jq '.stats.expected'   test-results.json)
          FAILED=$(jq '.stats.unexpected' test-results.json)
          SKIPPED=$(jq '.stats.skipped'   test-results.json)
          TOTAL=$(jq '.stats.expected + .stats.unexpected + .stats.skipped' test-results.json)
          DURATION=$(jq '.stats.duration' test-results.json)
          DURATION_SEC=$(echo "scale=1; $DURATION/1000" | bc)
        else
          PASSED=0; FAILED=0; SKIPPED=0; TOTAL=0; DURATION_SEC=0
        fi
        echo "passed=$PASSED"       >> $GITHUB_OUTPUT
        echo "failed=$FAILED"       >> $GITHUB_OUTPUT
        echo "skipped=$SKIPPED"     >> $GITHUB_OUTPUT
        echo "total=$TOTAL"         >> $GITHUB_OUTPUT
        echo "duration=$DURATION_SEC" >> $GITHUB_OUTPUT
 
    - name: Set status meta
      id: meta
      if: always()
      run: |
        FAILED="${{ steps.results.outputs.failed }}"
        STATUS="${{ job.status }}"
        if [ "$STATUS" = "success" ] || [ "$FAILED" = "0" ]; then
          echo "color=#2ECC71"  >> $GITHUB_OUTPUT
          echo "emoji=✅"       >> $GITHUB_OUTPUT
          echo "label=PASSED"   >> $GITHUB_OUTPUT
        else
          echo "color=#E74C3C"  >> $GITHUB_OUTPUT
          echo "emoji="       >> $GITHUB_OUTPUT
          echo "label=FAILED"   >> $GITHUB_OUTPUT
        fi
 
    - name: Zip Enterprise Report
      if: always()
      run: |
        if [ -d "test-results/enterprise-report" ]; then
          zip -r enterprise-report.zip test-results/enterprise-report/
          echo " enterprise-report.zip created"
        elif [ -d "playwright-report" ]; then
          zip -r enterprise-report.zip playwright-report/
          echo " playwright-report.zip created as fallback"
        else
          echo " No report folder found"
          echo "<html><body><h2>No report generated</h2></body></html>" > no-report.html
          zip enterprise-report.zip no-report.html
        fi
 
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: enterprise-report
        path: |
          test-results/enterprise-report/
          playwright-report/
        retention-days: 30
 
    - name: Notify Microsoft Teams
      if: always()
      run: |
        STATUS_COLOR=$([ "${{ steps.meta.outputs.label }}" = "PASSED" ] && echo "2ECC71" || echo "E74C3C")
        curl -H "Content-Type: application/json" -d '{
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "summary": "Playwright Tests",
          "themeColor": "'"$STATUS_COLOR"'",
          "title": "${{ steps.meta.outputs.emoji }} Playwright Test Results — ${{ steps.meta.outputs.label }}",
          "sections": [{
            "facts": [
              { "name": "📁 Repository", "value": "${{ github.repository }}" },
              { "name": "🌿 Branch",     "value": "${{ github.ref_name }}" },
              { "name": "🔁 Triggered",  "value": "${{ github.event_name }}" },
              { "name": "👤 Actor",      "value": "${{ github.actor }}" },
              { "name": "✅ Passed",     "value": "${{ steps.results.outputs.passed }}" },
              { "name": "❌ Failed",     "value": "${{ steps.results.outputs.failed }}" },
              { "name": "⏭️ Skipped",    "value": "${{ steps.results.outputs.skipped }}" },
              { "name": "🧮 Total",      "value": "${{ steps.results.outputs.total }}" },
              { "name": "⏱️ Duration",   "value": "${{ steps.results.outputs.duration }}s" }
            ],
            "markdown": true
          }],
          "potentialAction": [{
            "@type": "OpenUri",
            "name": "View GitHub Run",
            "targets": [{
              "os": "default",
              "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }]
        }' ${{ secrets.TEAMS_WEBHOOK_URL }}
 
    - name: Send report by email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "${{ steps.meta.outputs.emoji }} Playwright [${{ steps.meta.outputs.label }}] — ${{ github.repository }} @ ${{ github.ref_name }}"
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
        content_type: text/html
        body: |
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                background: #f0f2f5;
                padding: 30px 16px;
                color: #2c3e50;
              }
              .wrapper { max-width: 640px; margin: auto; }
 
              /* ── HEADER ── */
              .header {
                background: ${{ steps.meta.outputs.color }};
                border-radius: 12px 12px 0 0;
                padding: 30px 24px;
                text-align: center;
                color: #fff;
              }
              .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
              .header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }
              .badge {
                display: inline-block;
                margin-top: 12px;
                padding: 5px 20px;
                background: rgba(255,255,255,0.25);
                border: 2px solid rgba(255,255,255,0.6);
                border-radius: 30px;
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 1px;
              }
 
              /* ── STATS ROW ── */
              .stats {
                background: #fff;
                display: flex;
                justify-content: space-around;
                padding: 24px 16px;
                border-bottom: 1px solid #eaecef;
              }
              .stat { text-align: center; flex: 1; }
              .stat .num {
                font-size: 40px;
                font-weight: 800;
                line-height: 1;
              }
              .stat .lbl {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: #95a5a6;
                margin-top: 6px;
              }
              .passed  { color: #2ECC71; }
              .failed  { color: #E74C3C; }
              .skipped { color: #F39C12; }
              .total   { color: #3498DB; }
 
              /* ── INFO TABLE ── */
              .card {
                background: #fff;
                padding: 0 24px 24px;
              }
              table { width: 100%; border-collapse: collapse; margin-top: 8px; }
              td {
                padding: 11px 8px;
                font-size: 14px;
                border-bottom: 1px solid #f0f2f5;
                vertical-align: middle;
              }
              td:first-child {
                color: #7f8c8d;
                width: 38%;
                font-size: 13px;
              }
              td:last-child { font-weight: 600; color: #2c3e50; }
              tr:last-child td { border-bottom: none; }
 
              /* ── BUTTON ── */
              .btn-wrap { background: #fff; text-align: center; padding: 0 24px 28px; }
              .btn {
                display: inline-block;
                padding: 13px 36px;
                background: #3498DB;
                color: #fff !important;
                text-decoration: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.3px;
              }
 
              /* ── FOOTER ── */
              .footer {
                background: #fff;
                border-radius: 0 0 12px 12px;
                border-top: 1px solid #eaecef;
                text-align: center;
                padding: 16px 24px;
                font-size: 11px;
                color: #bdc3c7;
              }
 
              /* ── ATTACHMENT NOTE ── */
              .note {
                background: #eaf4fb;
                border-left: 4px solid #3498DB;
                border-radius: 0 6px 6px 0;
                margin: 0 24px 16px;
                padding: 10px 14px;
                font-size: 13px;
                color: #2980b9;
              }
</style>
</head>
<body>
<div class="wrapper">
 
              <!-- HEADER -->
<div class="header">
<h1>Playwright Test Report</h1>
<div class="subtitle">${{ github.repository }} &bull; ${{ github.ref_name }}</div>
<div class="badge">${{ steps.meta.outputs.emoji }} ${{ steps.meta.outputs.label }}</div>
</div>
 
              <!-- STATS -->
<div class="stats">
<div class="stat">
<div class="num passed">${{ steps.results.outputs.passed }}</div>
<div class="lbl">✅ Passed</div>
</div>
<div class="stat">
<div class="num failed">${{ steps.results.outputs.failed }}</div>
<div class="lbl">❌ Failed</div>
</div>
<div class="stat">
<div class="num skipped">${{ steps.results.outputs.skipped }}</div>
<div class="lbl">⏭️ Skipped</div>
</div>
<div class="stat">
<div class="num total">${{ steps.results.outputs.total }}</div>
<div class="lbl">🧮 Total</div>
</div>
</div>
 
              <!-- DETAILS -->
<div class="card">
<table>
<tr><td>📁 Repository</td><td>${{ github.repository }}</td></tr>
<tr><td>🌿 Branch</td><td>${{ github.ref_name }}</td></tr>
<tr><td>🔁 Triggered by</td><td>${{ github.event_name }}</td></tr>
<tr><td>👤 Actor</td><td>${{ github.actor }}</td></tr>
<tr><td>📝 Commit SHA</td><td>${{ github.sha }}</td></tr>
<tr><td>⏱️ Duration</td><td>${{ steps.results.outputs.duration }}s</td></tr>
</table>
</div>
 
              <!-- ATTACHMENT NOTE -->
<div class="note">
                Full HTML report is attached as <strong>enterprise-report.zip</strong> — unzip and open <code>index.html</code>
</div>
 
              <!-- BUTTON -->
<div class="btn-wrap">
<a class="btn" href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                  View Full GitHub Run
</a>
</div>
 
              <!-- FOOTER -->
<div class="footer">
                Generated by GitHub Actions &bull; ${{ github.workflow }} &bull; Run #${{ github.run_number }}
</div>
 
            </div>
</body>
</html>
        attachments: enterprise-report.zip
